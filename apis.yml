aid: glowbar
name: Glowbar
description: 'Glowbar is a New York-founded skincare studio chain offering expert 30-minute
  customized facials delivered by licensed estheticians across roughly 25 studios, sold
  through a monthly membership ($65/month for one facial, $120/month for two) alongside an
  $85 non-member walk-in price and a direct-to-consumer retail storefront of professional
  skincare products. Glowbar is not a software vendor and publishes no developer program,
  but its glowbar.com storefront runs on Shopify and therefore exposes a genuine, callable,
  unauthenticated agent surface: an agents.md / llms.txt agent instruction document, a
  Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp, and a live MCP
  endpoint at /api/ucp/mcp that answers tools/list anonymously with 13 catalog, cart,
  checkout and order tools carrying full JSON Schema 2020-12 input schemas. Appointment
  booking itself runs on a third-party platform (Boulevard) at bookings.glowbar.com and
  publishes no contract.'

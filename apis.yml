apis:
- name: Glowbar UCP Commerce MCP API
  description: 'The agent-facing commerce interface for the Glowbar online store. A Model
    Context Protocol (MCP) endpoint implementing the Universal Commerce Protocol (UCP)
    dev.ucp.shopping service, version 2026-04-08. Answers tools/list anonymously over
    JSON-RPC 2.0 with 13 tools spanning catalog search and lookup, cart lifecycle,
    checkout lifecycle and order retrieval, each carrying a full JSON Schema 2020-12
    inputSchema. Checkout completion requires explicit, contemporaneous human buyer
    approval per the store''s published agent rules. Implemented by the Shopify platform
    and served from Glowbar''s own host.'
  humanURL: https://glowbar.com/agents.md

generated: '2026-08-22'
method: probed
source: https://glowbar.com/.well-known/ucp + https://glowbar.com/.well-known/openid-configuration + mcp/glowbar-mcp-tools.json
note: >-
  Every entry below is asserted from a machine-readable document actually fetched from a
  Glowbar host on 2026-08-22, not from a marketing claim. Glowbar publishes no compliance
  programme, no certifications and no trust center of its own; the storefront's legal and
  security posture is the Shopify platform's, and that is recorded honestly as not-Glowbar
  rather than credited to Glowbar.
standards:
- id: ucp
  name: Universal Commerce Protocol
  version: '2026-04-08'
  conforms: true
  domain_standard: true
  market: retail / direct-to-consumer commerce
  evidence:
    location: https://glowbar.com/.well-known/ucp
    http_status: 200
    declaration: >-
      The merchant profile declares ucp.version "2026-04-08", supported_versions
      {2026-04-08, 2026-01-23}, a dev.ucp.shopping service with transport "mcp" and a
      concrete endpoint, and seven dev.ucp.shopping.* capability declarations each carrying
      a spec URI and a JSON Schema URI on ucp.dev.
  note: >-
    This is the domain-standard signature for this provider's market. An agent that already
    speaks UCP can search Glowbar's catalog, build a cart and drive a checkout with no
    bespoke connector. The declaration is in the contract, not in prose.
- id: ucp-shopping-catalog

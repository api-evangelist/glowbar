problem_types:
- id: invalid_profile_url
  jsonrpc_code: -32001
  http_status: 422
  title: UCP discovery failed
  detail: 'Unable to fetch agent profile: Missing profile uri'
  cause: >-
    The request omitted meta.ucp-agent.profile, or supplied a profile URI the store could not
    dereference.
  remediation: >-
    Supply meta.ucp-agent.profile on every tools/call with a publicly fetchable agent profile
    URI. Note that this error is returned for an unknown method name as well, so it can mask a
    method typo.
  method: probed
  evidence:
    url: https://glowbar.com/api/ucp/mcp
    http_status: 422
    observed: '2026-08-22'
    request: '{"jsonrpc":"2.0","id":9,"method":"does_not_exist"}'

- id: checkout_completion_error
  title: Checkout completion error
  detail: complete_checkout returns errors encountered during completion in its result payload.
  cause: Payment declined, inventory unavailable, or buyer approval absent.
  remediation: Read the errors returned in the complete_checkout result; do not retry without reusing the original meta.idempotency-key.

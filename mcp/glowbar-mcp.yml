method: probed
source: https://glowbar.com/api/ucp/mcp
note: >-
  Glowbar's storefront runs on Shopify, and Shopify serves a Universal Commerce Protocol
  (UCP) MCP endpoint from the merchant's own host. This is a real, live, anonymously
  callable agent surface at https://glowbar.com/api/ucp/mcp: an unauthenticated
  JSON-RPC 2.0 tools/list returned HTTP 200 with 13 tools, each carrying a complete
  JSON Schema 2020-12 inputSchema. The full response is saved verbatim as
  glowbar-mcp-tools.json. OWNERSHIP — the implementation is Shopify's, not Glowbar-authored
  software, but the endpoint is served from glowbar.com, and the store's UCP profile is
  Glowbar-specific: merchant name "Glowbar", merchant_origin glowbar.com, shop id
  44884033689, canonical shop glowbar-concierge.myshopify.com. The tools act on Glowbar's
  own catalog, carts and orders. It is recorded as Glowbar's agent surface with the platform
  provenance stated, not as software Glowbar built.
server:
  name: Glowbar UCP Commerce MCP
  protocol: Model Context Protocol over JSON-RPC 2.0
  transport: streamable-http
  implementation: Shopify (platform-provided UCP dev.ucp.shopping service)
  ucp_version: '2026-04-08'
  ucp_supported_versions:
  - '2026-04-08'
  - '2026-01-23'
  status: live
deployment:
  mode: remote
  endpoint: https://glowbar.com/api/ucp/mcp
  canonical_endpoint: https://glowbar-concierge.myshopify.com/api/ucp/mcp
  install: null
  package: null
  auth: none
  auth_note: >-
    tools/list requires no credentials. Individual tools/call invocations require a
    meta.ucp-agent.profile URI (an agent profile URL the store fetches); calls without it
    return HTTP 422 with JSON-RPC error -32001 invalid_profile_url. Buyer-authenticated
    operations use Shopify Customer Accounts OAuth/OIDC (see authentication/ and scopes/).
  verified: probed
  verified_on: '2026-08-22'

source: mcp/glowbar-mcp-tools.json + https://glowbar.com/agents.md + https://glowbar.com/llms.txt
note: >-
  Glowbar publishes NO OpenAPI, so there are no operationIds to bind to. What it does publish
  — in agents.md and llms.txt — is a documented read-only HTTP surface (the Shopify storefront
  JSON endpoints) alongside the 13-tool MCP surface. This crosswalk binds the MCP tools to
  those documented HTTP paths instead of to operationIds, and records the divergence: the
  entire cart, checkout and order lifecycle is MCP-only with no documented HTTP equivalent,
  while collection/sitemap browsing is HTTP-only with no tool. Confidence is capped at medium
  everywhere because the binding is by documented semantics, not by a shared contract.
surfaces:
  openapi: null
  openapi_note: No OpenAPI, Swagger, GraphQL SDL, gRPC or WSDL contract is published on any Glowbar host.
  graphql: null
  mcp: https://glowbar.com/api/ucp/mcp
  mcp_gated: false
  mcp_note: tools/list is anonymous; tools/call requires a meta.ucp-agent.profile URI.
  http_read: https://glowbar.com/agents.md
  http_read_note: Read-only storefront JSON paths documented under "Read-Only Browsing (No Authentication Required)".
